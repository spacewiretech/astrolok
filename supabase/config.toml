project_id = "qktgingrvecpetrofimy"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Ceiling on rows a single PostgREST request can return, so a bad query cannot pull the table.
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Supabase Auth is unused: the app verifies phone numbers through Fast2SMS and the Edge
# Functions issue their own session tokens.
[auth]
enabled = false

# verify_jwt = false because these are called with the anon key before any session exists.
# Each function does its own validation: send/resend/verify are rate limited per mobile,
# and me/update-profile require a bearer session token.
[functions.send-otp]
verify_jwt = false

[functions.resend-otp]
verify_jwt = false

[functions.verify-otp]
verify_jwt = false

[functions.me]
verify_jwt = false

[functions.update-profile]
verify_jwt = false

# Readings. Requires a bearer session token, re-checks entitlement server-side, and holds the
# Gemini key so it never ships inside the app.
[functions.palm-reading]
verify_jwt = false

[functions.face-reading]
verify_jwt = false

# The chat. astro-chat spends money and meters itself; chat-history only reads, and is also
# where a user forgets what Astro has learned about them.
[functions.astro-chat]
verify_jwt = false

[functions.chat-history]
verify_jwt = false

# Payments. subscription-* require a bearer session token and derive the user from it, so no
# request can name an account other than its own.
[functions.subscription-start]
verify_jwt = false

[functions.subscription-status]
verify_jwt = false

[functions.subscription-cancel]
verify_jwt = false

# Called by Cashfree, which cannot send a Supabase apikey header — so this one must be publicly
# invokable. It authenticates the caller by verifying the HMAC signature over the raw body
# instead, and refuses to process anything that does not verify.
[functions.cashfree-webhook]
verify_jwt = false

# Called by pg_cron, authenticated with app_config.reconcile_secret.
[functions.subscription-reconcile]
verify_jwt = false

# Push. Requires a bearer session token, and stores the device token against that session so
# sign-out and expiry remove it by cascade.
[functions.push-token]
verify_jwt = false

# Kundali. place-search proxies Google Places so the key stays server-side; kundali requires a
# bearer session token and re-checks entitlement. Both are metered per user.
[functions.place-search]
verify_jwt = false

[functions.kundali]
verify_jwt = false

# Called by pg_cron every five minutes, authenticated with x-cron-secret (app_config.reconcile_secret).
[functions.kundali-worker]
verify_jwt = false

# Push notifications. notification-dispatch is called by pg_cron every five minutes (and by an
# operator for dry_run / send_test), authenticated with x-cron-secret.
[functions.notification-dispatch]
verify_jwt = false

# The why-are-you-leaving answer. Bearer session token only, no entitlement check: a trial user who
# cancels loses access the same minute.
[functions.cancellation-feedback]
verify_jwt = false

# Referrals and install attribution. All three take a bearer session token like everything above.
#
# Listed here because the CLI's default for a function this file does not mention is
# `verify_jwt = true`, and that is fatal for this project: Supabase Auth is unused, so the token
# the app sends is our own opaque session token and not a JWT at all. The gateway rejects it with
# `UNAUTHORIZED_INVALID_JWT_FORMAT` before the function runs — no log line, no error anywhere on
# our side, the feature simply records nothing. These three were omitted and were dead in
# production from launch until 2026-09-18: `referral_codes`, `referrals` and `user_attribution`
# all held zero rows while `referral_enabled` was true.
#
# So: every new function needs a block here in the same change that creates it.
[functions.referral-code]
verify_jwt = false

[functions.referral-claim]
verify_jwt = false

[functions.attribution-report]
verify_jwt = false
