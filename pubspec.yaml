name: astrolok
description: "Astrology, palm reading and astro talk."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State and routing.
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0

  # Clean `/privacy` URLs on the marketing site instead of `/#/privacy`. Web-only, and only
  # reached through `lib/website/url_strategy.dart`'s conditional export.
  flutter_web_plugins:
    sdk: flutter

  # Backend. Supabase proxies OTP through Edge Functions so the Fast2SMS key stays off-device;
  # http is the direct-to-Fast2SMS fallback for builds with no Supabase configured.
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1

  # Payments. UPI Autopay mandates, one-tap intent.
  flutter_cashfree_pg_sdk: ^2.4.0

  # Storage. The session token is a bearer credential, so it lives in the Keychain/Keystore;
  # cosmetic preferences and the config cache go in shared_preferences.
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Presentation.
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # The paywall's promo clip, streamed from the URL in app_config so it can be swapped
  # without shipping a release. Absent config falls back to a static poster.
  video_player: ^2.9.2

  # Palm reading. `camera` rather than image_picker's camera because the capture screen draws
  # its own square viewfinder with corner brackets over the live preview, which the OS camera
  # UI cannot do; image_picker is the gallery path beside it, and the only way to work on a
  # simulator, which has no camera at all.
  camera: ^0.12.0+2
  image_picker: ^1.2.3

  # Downscaling the capture before it goes to the model. flutter_image_compress is native and
  # off the platform thread — a 12MP decode in pure Dart is over a second of jank on a
  # mid-range Android. `image` only centre-crops the already-small result.
  flutter_image_compress: ^2.5.1
  image: ^4.9.2
  path_provider: ^2.1.6

  # Reading the result aloud, and exporting it. TTS is on-device: free, offline, and it starts
  # speaking instantly, which matters for something a user replays. `pdf` composes the export;
  # `printing` is deliberately not used — it exists for a platform print dialog and a native
  # share sheet, and share_plus above already covers the sharing.
  flutter_tts: ^4.2.5
  pdf: ^3.13.0

  # Product analytics. The project token is deliberately not compiled in — it comes from the
  # `app_config` table at runtime, so tracking can be turned off server-side without a release,
  # and a checkout with no token simply runs on the no-op implementation.
  mixpanel_flutter: ^2.13.0

  # Version and build number, for the one question the Mixpanel SDK cannot answer on its own:
  # whether this launch is a first install or an upgrade. Everything else about the handset —
  # model, OS, screen, carrier — the SDK already sends without being asked.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# The exported mark is 80x80. Both stores want 1024 square, so this stops the app shipping the
# Flutter default but a full-size export is still needed before release.
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Matches the disc, so the iOS icon has no white ring where the alpha is flattened.
  background_color_ios: "#000C2B"

flutter:
  uses-material-design: true

  # Declared as directories, not individual files, so a checkout that has not yet created
  # assets/env/app.env still builds.
  assets:
    - assets/images/
    - assets/icons/
    - assets/env/
    # Declared as assets, not under `fonts:` — the UI keeps rendering Poppins through
    # google_fonts, and only the PDF export needs the raw bytes. The pdf package's built-in
    # Helvetica covers Latin-1 and nothing else, so a reading that comes back with a curly
    # quote or a dash would render it as a blank box.
    - assets/fonts/
